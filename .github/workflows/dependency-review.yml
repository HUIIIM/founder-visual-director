# Dependency review on PRs: fail when a change introduces high+ severity
# vulnerable dependencies (uses the repo dependency graph; no checkout needed).
name: Dependency review
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
