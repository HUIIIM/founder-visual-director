# Release on a version tag: source tarball, CycloneDX SBOM and SHA256SUMS, each signed keyless with
# Sigstore (cosign *.sigstore.json bundles), plus GitHub build-provenance attestations (SLSA v1).
# Every action is pinned by commit SHA (SOTA SEC-A5). See docs/RELEASING.md for verify and rollback.
name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
jobs:
  release:
    name: build, sign and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub release and upload assets
      id-token: write # Sigstore keyless signing and provenance
      attestations: write # store build-provenance attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Tag must match SKILL.md version and have a CHANGELOG entry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          declared="$(sed -n 's/^  version: "\(.*\)"$/\1/p' SKILL.md)"
          if [ "$version" != "$declared" ]; then
            echo "::error::tag $TAG does not match SKILL.md metadata.version $declared"; exit 1
          fi
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [$version] section"; exit 1; }
          # #43: everything that ships must be listed under its version, or the release notes
          # (cut from the [$version] section below) silently omit it.
          pending="$(awk '/^## \[Unreleased\]/ {f=1; next} f && /^## / {exit} f' CHANGELOG.md | grep -c '^- ' || true)"
          [ "$pending" = "0" ] || { echo "::error::CHANGELOG.md [Unreleased] still lists $pending entries; move them into [$version] before tagging"; exit 1; }
      - name: Tag must point at a commit on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || {
            echo "::error::tag commit $GITHUB_SHA is not on main; release tags go on a merged commit (LOOP.md)"; exit 1; }
      - name: Release gate (same checks as PR CI)
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          ruff check demo scripts tests
          python -m unittest discover -s tests
          python scripts/validate_skill.py
          bash demo/eval.sh
          git diff --exit-code demo/output
      - name: Build artifacts (reproducible from the tag)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct "$TAG")"
          export SOURCE_DATE_EPOCH
          mkdir dist
          git archive --format=tar.gz --prefix="founder-visual-director-$version/" \
            -o "dist/founder-visual-director-$version.tar.gz" "$TAG"
          python scripts/make_sbom.py "$version" "dist/founder-visual-director-$version.cdx.json"
          (cd dist && sha256sum -- * > SHA256SUMS)
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} f && /^## / {exit} f' CHANGELOG.md > release-notes.md
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2 (cosign v3.0.6)
      - name: Sign artifacts (keyless, Sigstore bundle per file)
        run: |
          cd dist
          for f in *.tar.gz *.cdx.json SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: Build-provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.cdx.json
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file release-notes.md
