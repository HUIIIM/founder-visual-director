name: Claude Code

# Trigger path for the Claude direct loop (installed 2026-11-01): the
# repo-owned workflow for jarvis-task execution. Credential: the
# CLAUDE_CODE_OAUTH_TOKEN repository secret (subscription OAuth route,
# chairman order 2026-11-01). The Claude GitHub App's managed runs do not
# consume repo secrets, so this workflow is the operative path.

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Direct prompt for Claude Code (dispatch path)'
        required: true
        type: string
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# One run per issue/PR at a time; a second @claude waits instead of racing the first.
# GitHub keeps one running and ONE pending run per group: a third @claude while one is
# pending replaces (cancels) the pending one. Re-mention after the run finishes.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    # Trust gate (independent review #32 P1-1): run only when the person who wrote the
    # triggering text AND the author of the issue/PR it sits on are OWNER, MEMBER or
    # COLLABORATOR. Text written by anyone else never reaches a write-scoped agent, whatever
    # event (comment, review, opened, assigned) carries it there.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    # SEC-8: bound every job; the default is 6 hours.
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          # #50: the job token never needs to sit in .git/config; the action authenticates
          # its own push (and strips this header anyway, git-config.ts replaceCheckoutCredentials).
          persist-credentials: false

      # #51 round 3: two steps. git's own option parsing (unique-prefix abbreviations such as
      # --pathspec-fr, bundled -qF, quote-split --path"spec-fr") lets any allowed git
      # subcommand that takes a file option read a file for the agent, and GH_TOKEN sits in
      # every subprocess environment (claude-code-action run.ts sets it). No deny list over
      # the command text is sound against that, so comment/issue runs below get NO git
      # subcommand that can read a file and commit through the action's API instead.
      # This step is the maintainer-prompt path only (workflow_dispatch needs write access);
      # it keeps the git CLI because API commits in agent mode target the dispatch branch.
      - name: Run Claude Code (workflow_dispatch, maintainer prompt)
        if: github.event_name == 'workflow_dispatch'
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # #51 round 2: keep the action's token out of .git/config. With this input empty,
          # claude-code-action (d535f51, git-config.ts replaceCheckoutCredentials) writes
          # https://x-access-token:<token>@… into the origin URL, and git options that read a
          # file (--pathspec-from-file and its abbreviations, quoted forms, commit -F) can echo
          # it back. Any non-empty value switches it to a credential helper that reads GH_TOKEN
          # at auth time, and turns on subprocess env scrubbing + bubblewrap isolation.
          # The value is a login GitHub can never issue (logins cannot start with a hyphen), so
          # no one gains access: the action's bypass also needs github_token, which this
          # workflow does not pass, and the `if:` trust gate above runs first.
          allowed_non_write_users: "-no-such-user-"
          prompt: ${{ inputs.prompt }}
          # Tool allowlist (run 41365340458 had permission_denials_count=3 and
          # landed no artifacts): Write/Edit = create the deliverable files, the git
          # subcommands = branch/commit/push, the gh subcommands = open PR + comment.
          # Named subcommands only (#32 P1-1): a bare Bash(git:*) also allowed
          # `git -c alias.x='!cmd' x`, i.e. any shell; a bare Bash(gh:*) allowed `gh api`.
          # #36 SEC-A3: a `:*` prefix rule still accepts any later option, so every git
          # command that can run a program or write a file through an option is pinned
          # to an exact form (no `:*`): push (--receive-pack/--exec), diff/log/show
          # (--output, --ext-diff). fetch/pull (--upload-pack) are not allowed at all;
          # the checkout step already fetched what the job needs. Write/Edit may not
          # touch .git/ (core.fsmonitor, hooks), and are scoped to the workspace (./**):
          # git also reads ~/.gitconfig and ~/.config/git/config, which could plant the
          # same program outside .git/ (#36 round 4). Not ~/** itself: the runner workspace
          # lives under /home/runner. tests/test_workflow_allowlist.py
          # fails the build if any of this regresses.
          # #40: tag mode adds a bare Read on top of this list, so scoping Read to ./** is not
          # enough on its own: /proc (the OAuth token is in the process environment) and
          # ~/.claude are denied explicitly. gh --body-file / -F (which would post any readable
          # file to a public thread) is denied by text only, and quote-splitting
          # (--body-f"ile") gets past that (#51 round 4): on comment/issue runs the gh write
          # commands are therefore not allowed at all; on this dispatch path it is a residual
          # sent for a ruling in #52.
          # The same exit exists through git (#47 round 7): `git commit -F/--file/-t <path>`
          # or `-m "$(cat …)"` puts a file into a commit message that the allowed push
          # publishes. Tag mode adds Bash(git commit:*) itself, so these are denies too, and
          # any command substitution ($(…) or backticks) is denied outright.
          # #50: in tag mode the action writes its token into .git/config as the origin URL
          # (claude-code-action git-config.ts, no ALLOWED_NON_WRITE_USERS here), so Read of
          # .git/** is denied too. git itself can still read a file for the agent:
          # --pathspec-from-file=<path> echoes each line in its error output (#51 round 1),
          # so that option is denied on every allowed git subcommand that takes it, and by
          # fragment (git accepts any unique prefix: --pathspec-fr), together with any command
          # naming environ or /proc/ (#51 round 3: GH_TOKEN sits in the subprocess env).
          # `//` = absolute path in Claude Code rules. #44 item 2 (ARCH-4): --max-turns caps
          # the loop; timeout-minutes caps wall time.
          claude_args: >-
            --allowedTools "Read(./**),Glob,Grep,Write(./**),Edit(./**),Bash(git status),Bash(git diff),Bash(git diff --staged),Bash(git log --oneline -20),Bash(git rev-parse:*),Bash(git branch:*),Bash(git checkout:*),Bash(git switch:*),Bash(git add:*),Bash(git commit:*),Bash(git push -u origin HEAD),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue comment:*)"
            --disallowedTools "Edit(.git/**),Write(.git/**),Edit(**/.git/**),Write(**/.git/**),Read(.git/**),Read(**/.git/**),Edit(~/.gitconfig),Write(~/.gitconfig),Edit(~/.config/**),Write(~/.config/**),Read(//proc/**),Read(~/.claude/**),Bash(gh * --body-file*),Bash(gh * -F *),Bash(gh * -F*),Bash(git commit -F*),Bash(git commit * -F*),Bash(git commit --file*),Bash(git commit * --file*),Bash(git commit -t*),Bash(git commit * -t*),Bash(git commit --template*),Bash(git commit * --template*),Bash(*$(*),Bash(*`*),Bash(git checkout --pathspec-from-file*),Bash(git checkout * --pathspec-from-file*),Bash(git checkout --pathspec-file-nul*),Bash(git checkout * --pathspec-file-nul*),Bash(git commit --pathspec-from-file*),Bash(git commit * --pathspec-from-file*),Bash(git commit --pathspec-file-nul*),Bash(git commit * --pathspec-file-nul*),Bash(git add --pathspec-from-file*),Bash(git add * --pathspec-from-file*),Bash(git add --pathspec-file-nul*),Bash(git add * --pathspec-file-nul*),Bash(git rm --pathspec-from-file*),Bash(git rm * --pathspec-from-file*),Bash(git rm --pathspec-file-nul*),Bash(git rm * --pathspec-file-nul*),Bash(git switch --pathspec-from-file*),Bash(git switch * --pathspec-from-file*),Bash(git switch --pathspec-file-nul*),Bash(git switch * --pathspec-file-nul*),Bash(*pathspec*),Bash(*environ*),Bash(*/proc/*)"
            --max-turns 40

      - name: Run Claude Code (comment / issue events, API commits)
        if: github.event_name != 'workflow_dispatch'
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # #51 round 2: credential helper instead of a token in .git/config (see above).
          allowed_non_write_users: "-no-such-user-"
          # Commits go through mcp__github_file_ops__commit_files to the branch the action
          # creates; tag mode then adds no Bash(git add/commit/rm:*) of its own.
          use_commit_signing: true
          prompt: ${{ inputs.prompt }}
          # Same lists as the dispatch step above minus every git subcommand that takes a
          # file option (checkout, switch, add, commit, rm, push), and minus every gh command
          # that takes a body file: quote-split --body-f"ile" / -"F" read any runner file and
          # post it (#51 round 4). Replies go through the action's own
          # mcp__github_comment__update_claude_comment, which takes the body as a string.
          claude_args: >-
            --allowedTools "Read(./**),Glob,Grep,Write(./**),Edit(./**),Bash(git status),Bash(git diff),Bash(git diff --staged),Bash(git log --oneline -20),Bash(git rev-parse:*),Bash(git branch:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*)"
            --disallowedTools "Edit(.git/**),Write(.git/**),Edit(**/.git/**),Write(**/.git/**),Read(.git/**),Read(**/.git/**),Edit(~/.gitconfig),Write(~/.gitconfig),Edit(~/.config/**),Write(~/.config/**),Read(//proc/**),Read(~/.claude/**),Bash(gh * --body-file*),Bash(gh * -F *),Bash(gh * -F*),Bash(git commit -F*),Bash(git commit * -F*),Bash(git commit --file*),Bash(git commit * --file*),Bash(git commit -t*),Bash(git commit * -t*),Bash(git commit --template*),Bash(git commit * --template*),Bash(*$(*),Bash(*`*),Bash(git checkout --pathspec-from-file*),Bash(git checkout * --pathspec-from-file*),Bash(git checkout --pathspec-file-nul*),Bash(git checkout * --pathspec-file-nul*),Bash(git commit --pathspec-from-file*),Bash(git commit * --pathspec-from-file*),Bash(git commit --pathspec-file-nul*),Bash(git commit * --pathspec-file-nul*),Bash(git add --pathspec-from-file*),Bash(git add * --pathspec-from-file*),Bash(git add --pathspec-file-nul*),Bash(git add * --pathspec-file-nul*),Bash(git rm --pathspec-from-file*),Bash(git rm * --pathspec-from-file*),Bash(git rm --pathspec-file-nul*),Bash(git rm * --pathspec-file-nul*),Bash(git switch --pathspec-from-file*),Bash(git switch * --pathspec-from-file*),Bash(git switch --pathspec-file-nul*),Bash(git switch * --pathspec-file-nul*),Bash(*pathspec*),Bash(*environ*),Bash(*/proc/*)"
            --max-turns 40
