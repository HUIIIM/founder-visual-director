name: Claude Code

# Trigger path for the Claude direct loop (installed 2026-11-01): the
# repo-owned workflow for jarvis-task execution. Credential: the
# CLAUDE_CODE_OAUTH_TOKEN repository secret (subscription OAuth route,
# chairman order 2026-11-01). The Claude GitHub App's managed runs do not
# consume repo secrets, so this workflow is the operative path.

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Direct prompt for Claude Code (dispatch path)'
        required: true
        type: string
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# One run per issue/PR at a time; a second @claude waits instead of racing the first.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    # Trust gate (independent review #32 P1-1): run only when the person who wrote the
    # triggering text AND the author of the issue/PR it sits on are OWNER, MEMBER or
    # COLLABORATOR. Text written by anyone else never reaches a write-scoped agent, whatever
    # event (comment, review, opened, assigned) carries it there.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    # SEC-8: bound every job; the default is 6 hours.
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ inputs.prompt }}
          # Tool allowlist (run 41365340458 had permission_denials_count=3 and
          # landed no artifacts): Write/Edit = create the deliverable files, the git
          # subcommands = branch/commit/push, the gh subcommands = open PR + comment.
          # Named subcommands only (#32 P1-1): a bare Bash(git:*) also allowed
          # `git -c alias.x='!cmd' x`, i.e. any shell; a bare Bash(gh:*) allowed `gh api`.
          claude_args: >-
            --allowedTools "Read,Glob,Grep,Write,Edit,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git rev-parse:*),Bash(git branch:*),Bash(git checkout:*),Bash(git switch:*),Bash(git add:*),Bash(git commit:*),Bash(git fetch:*),Bash(git pull:*),Bash(git push:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue comment:*)"
