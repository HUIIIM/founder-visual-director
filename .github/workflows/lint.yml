# Lint, unit tests and skill-package validation on every PR. vertciti standard QA-1 / QA-2.
name: Lint and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: lint, tests, skill validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: founder-visual-director
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install pinned lint tools (hash-checked)
        working-directory: founder-visual-director
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Ruff
        working-directory: founder-visual-director
        run: ruff check demo scripts tests
      - name: Unit tests
        working-directory: founder-visual-director
        run: python -m unittest discover -s tests -v
      - name: Skill package validation (Agent Skills spec, rule sync, evals)
        working-directory: founder-visual-director
        run: python scripts/validate_skill.py
