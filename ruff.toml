# Lint gate run in CI (.github/workflows/lint.yml). Bug-focused rule set: syntax and import errors,
# pyflakes (undefined names, unused imports/variables) and flake8-bugbear.
# Style rules (pyupgrade, simplify) are not gated yet; most current hits are in demo/run.py,
# which is being changed in parallel. Widen `select` once that settles.
target-version = "py310"
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F", "B"]
